name: Windows Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Get version from application
        id: app_version
        shell: pwsh
        run: |
          $tag = (python -c "from update import VERSION; print('v' + VERSION)").Trim()
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release version: $tag"
          }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) {
            throw 'Git tag must match VERSION in update.py'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Package standalone Windows executable
        run: python -m PyInstaller --noconfirm --clean LogCollector.spec

      - name: Verify frozen EXE startup and runtime contents
        run: python scripts/verify_windows_build.py

      - name: Package portable fallback
        shell: pwsh
        run: Compress-Archive -Path dist/LogCollector-Portable -DestinationPath dist/LogCollector-Portable.zip -Force

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path dist/LogCollector.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LogCollector.exe" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          $portableHash = (Get-FileHash -Path dist/LogCollector-Portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$portableHash  LogCollector-Portable.zip" | Add-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogCollector-Windows-${{ steps.app_version.outputs.tag }}
          path: |
            dist/LogCollector.exe
            dist/LogCollector-Portable.zip
            dist/SHA256SUMS.txt
            dist/startup-verification.json
          if-no-files-found: error

      # Auto-publish the first Release for a new VERSION, and create its tag.
      # Existing versions are never overwritten. Just bump VERSION to publish
      # the next release on the next push to main.
      - name: Publish new version if not already released
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; keeping the existing assets unchanged."
            exit 0
          }
          $notesPath = "notes/$env:RELEASE_TAG.md"
          $notesArgs = if (Test-Path $notesPath) { @('--notes-file', $notesPath) } else { @('--generate-notes') }
          gh release create $env:RELEASE_TAG dist/LogCollector.exe dist/LogCollector-Portable.zip dist/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Log Collector $env:RELEASE_TAG" `
            @notesArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
